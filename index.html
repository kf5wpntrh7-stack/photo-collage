<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#263849">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>手機圖片拼接 v5.3</title>
<style>
:root{
  --bg:#eef1f4; --card:#fff; --navy:#263849; --navy2:#3e566c; --line:#dce3e8;
  --text:#22303b; --muted:#72808b; --soft:#e9eef2; --danger:#a24f4f;
  --shadow:0 7px 24px rgba(31,45,57,.08);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif
}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
header{
  position:sticky;top:0;z-index:30;color:#fff;
  background:linear-gradient(145deg,var(--navy),var(--navy2));
  padding:calc(13px + env(safe-area-inset-top)) 14px 13px;
  box-shadow:0 5px 18px rgba(21,34,45,.2)
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:20px;margin:0}
.subtitle{font-size:12px;opacity:.8;margin-top:3px}
.reset-top{border:0;background:rgba(255,255,255,.13);color:#fff;border-radius:11px;padding:9px 11px;font-weight:700}

.step-tabs{
  position:sticky;top:calc(73px + env(safe-area-inset-top));z-index:25;
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  padding:8px 10px;background:rgba(238,241,244,.96);backdrop-filter:blur(12px)
}
.step-tab{
  border:0;border-radius:10px;padding:10px 4px;background:#e4e9ed;
  color:#687680;font-weight:800;font-size:12px
}
.step-tab.active{background:var(--navy);color:#fff}
main{max-width:760px;margin:auto;padding:10px 10px calc(95px + env(safe-area-inset-bottom))}
.step-panel{display:none}
.step-panel.active{display:block}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);
  margin-bottom:10px;overflow:hidden
}
.card-title{padding:12px 13px 5px;font-weight:800}
.card-note,.compact-note{padding:0 13px 12px;font-size:12px;color:var(--muted);line-height:1.45}
.upload-wrap{padding:12px}
.upload-box{
  width:100%;min-height:112px;border:2px dashed #aebbc5;border-radius:14px;background:#f8fafb;
  display:grid;place-items:center;padding:18px;text-align:center;cursor:pointer
}
.upload-icon{font-size:30px}
.upload-main{font-weight:800;margin-top:4px}
.upload-sub{font-size:12px;color:var(--muted);margin-top:4px}

.photo-strip{
  display:flex;gap:8px;overflow-x:auto;padding:10px 10px 12px;scrollbar-width:none
}
.photo-chip{
  flex:0 0 92px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px
}
.photo-chip img{width:80px;height:80px;object-fit:cover;border-radius:9px;background:#edf1f4}
.photo-chip-index{text-align:center;font-size:11px;color:var(--muted);margin-top:5px}
.photo-chip-actions{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:5px}
.photo-chip-actions button{
  border:0;border-radius:8px;background:var(--soft);padding:6px 0;font-weight:800;color:#465865
}
.photo-chip-actions .danger{color:var(--danger);grid-column:1/-1}

.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px 0}
.mode-tab{border:0;border-radius:10px;padding:10px;background:#e9eef2;color:#65737e;font-weight:800}
.mode-tab.active{background:var(--navy);color:#fff}
.layout-panel{display:none}
.layout-panel.active{display:block}
.layout-scroll{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 12px;scrollbar-width:none}
.layout{
  flex:0 0 92px;border:1px solid var(--line);background:#fff;border-radius:12px;min-height:72px;
  padding:8px 5px;color:var(--text)
}
.layout.active{background:var(--navy);border-color:var(--navy);color:#fff}
.layout-icon{width:32px;height:32px;margin:auto auto 5px;display:grid;gap:2px}
.layout-icon span{display:block;background:currentColor;border-radius:2px;opacity:.82}
.icon-v{grid-template-rows:1fr 1fr}
.icon-h{grid-template-columns:1fr 1fr}
.icon-v3{grid-template-rows:repeat(3,1fr)}
.icon-h3{grid-template-columns:repeat(3,1fr)}
.icon-v4{grid-template-rows:repeat(4,1fr)}
.icon-h4{grid-template-columns:repeat(4,1fr)}
.icon-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.icon-6{grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr)}
.icon-9{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.custom-grid{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.custom-grid .big-top{grid-column:1/-1}
.custom-grid .big-bottom{grid-column:1/-1;grid-row:2}
.custom-grid.left-big .big-left{grid-row:1/-1}
.custom-grid.right-big .big-right{grid-column:2;grid-row:1/-1}
.layout-label{font-size:12px;font-weight:750}

.controls{padding:4px 12px 13px}
.control{margin-top:10px}
.control:first-child{margin-top:0}
.control-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.control label{font-size:13px;font-weight:700}
.control-value{font-size:12px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--navy)}
.segment{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#edf1f4;border-radius:11px;padding:4px
}
.segment button{
  border:0;background:transparent;border-radius:8px;padding:9px 6px;color:#65737e;font-size:13px;font-weight:750
}
.segment button.active{background:#fff;color:var(--text);box-shadow:0 2px 7px rgba(30,44,57,.08)}
.ratio-wrap{display:none}
.ratio-wrap.show{display:block}
.capacity{
  display:none;margin:8px 12px 12px;border:1px solid #e5cf80;background:#fff5cf;border-radius:10px;
  padding:9px 10px;font-size:12px;line-height:1.45
}
.capacity.show{display:block}

.preview-wrap{padding:10px 10px 12px}
.canvas-shell{
  min-height:190px;border-radius:13px;overflow:auto;background:#dfe4e8;display:grid;place-items:center;padding:10px
}
canvas{display:block;width:100%;height:auto;background:#fff;box-shadow:0 5px 18px rgba(31,45,57,.14);user-select:none;-webkit-user-select:none}
.canvas-stage{position:relative;display:inline-block;max-width:100%;line-height:0;user-select:none;-webkit-user-select:none}
.grid-overlay{position:absolute;inset:0;pointer-events:none;user-select:none;-webkit-user-select:none}
.grid-overlay.active{pointer-events:auto}
.grid-hit{
  position:absolute;border:2px solid transparent;background:rgba(0,0,0,0);
  padding:0;margin:0;border-radius:8px;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none
}
.grid-hit:active,.grid-hit.selected{border-color:#33a0ff;background:rgba(51,160,255,.10)}
.grid-badge{
  position:absolute;top:5px;left:5px;min-width:24px;height:24px;border-radius:999px;
  background:rgba(38,56,73,.82);color:#fff;font-size:12px;font-weight:800;
  display:grid;place-items:center;line-height:1;pointer-events:none
}
.empty-preview{text-align:center;color:var(--muted);padding:35px 15px;font-size:13px}
.preview-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.preview-hint strong{color:var(--navy)}
.btn{border:0;border-radius:12px;padding:12px 10px;font-weight:800;background:var(--soft);color:var(--text)}
.btn.primary{background:var(--navy);color:#fff}
.btn:disabled{opacity:.45}
.full-btn{width:100%}

.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(250,251,252,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom))
}
.bottom-inner{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1.35fr;gap:8px}

.edit-modal{
  position:fixed;inset:0;display:none;z-index:70;background:rgba(15,24,31,.58);align-items:flex-end
}
.edit-modal.show{display:flex}
.edit-sheet{
  width:100%;background:#fff;border-radius:20px 20px 0 0;padding:10px 14px calc(15px + env(safe-area-inset-bottom))
}
.edit-grab{width:42px;height:4px;background:#d4dade;border-radius:999px;margin:2px auto 10px}
.edit-title{font-size:17px;font-weight:800}
.edit-note{font-size:12px;color:var(--muted);margin-top:4px;margin-bottom:10px}
.edit-stage{
  width:min(88vw,430px);margin:auto;border-radius:14px;overflow:hidden;position:relative;
  background:#e4e9ec;border:1px solid var(--line);touch-action:none
}
.edit-stage img{
  position:absolute;max-width:none;max-height:none;user-select:none;-webkit-user-drag:none;pointer-events:none
}
.edit-cross:before,.edit-cross:after{
  content:"";position:absolute;background:rgba(255,255,255,.6);pointer-events:none
}
.edit-cross:before{left:50%;top:0;bottom:0;width:1px}
.edit-cross:after{top:50%;left:0;right:0;height:1px}
.edit-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.edit-actions button{border:0;border-radius:11px;padding:11px;font-weight:800}
.edit-actions .soft{background:var(--soft);color:var(--text)}
.edit-actions .primary{background:var(--navy);color:#fff}
.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:#263849;color:#fff;padding:9px 13px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;
  transition:.2s;z-index:80;white-space:nowrap
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:700px){
  .edit-modal{align-items:center;justify-content:center;padding:20px}
  .edit-sheet{max-width:520px;border-radius:20px}
}

main{padding-top:10px}
.settings-details{border-top:1px solid var(--line)}
.settings-details summary{
  list-style:none;cursor:pointer;padding:11px 13px;font-size:13px;font-weight:800;color:#4d6070;
  user-select:none;-webkit-user-select:none
}
.settings-details summary::-webkit-details-marker{display:none}
.settings-details summary:after{content:"＋";float:right}
.settings-details[open] summary:after{content:"－"}
.thumb-wrap{
  width:80px;height:80px;border-radius:9px;background:#edf1f4;overflow:hidden;position:relative;
  display:grid;place-items:center
}
.thumb-wrap img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.rotation-badge{
  position:absolute;right:4px;bottom:4px;background:rgba(38,56,73,.82);color:#fff;
  border-radius:999px;padding:3px 6px;font-size:10px;font-weight:800
}
.rotate-flash{animation:rotateFlash .3s ease}
@keyframes rotateFlash{0%{transform:scale(.92)}100%{transform:scale(1)}}
.edit-stage{touch-action:none!important;overscroll-behavior:contain}
.edit-stage.dragging{outline:3px solid #33a0ff}
.edit-stage.pinching{outline:3px solid #6b7cff}


.gesture-status{
  margin:0 auto 9px;width:min(88vw,430px);padding:7px 9px;border-radius:9px;
  text-align:center;background:#eef5fa;color:#476277;font-size:12px;font-weight:750
}
.zoom-buttons{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  width:min(88vw,430px);margin:10px auto 0
}
.zoom-buttons button{
  border:0;border-radius:10px;padding:10px;background:var(--soft);
  color:var(--text);font-weight:800
}
.edit-stage{cursor:grab}
.edit-stage.drag-active{cursor:grabbing;outline:3px solid #33a0ff}
.edit-stage.pinch-active{outline:3px solid #7b70ff}


.card{margin-bottom:8px}
.photo-strip{padding-top:6px;padding-bottom:8px}
.layout-scroll{padding-top:7px;padding-bottom:9px}
.preview-wrap{padding-top:6px}
.bottom-inner{grid-template-columns:1fr 1.2fr}
.edit-modal{
  position:fixed;inset:0;z-index:100;
  display:none;align-items:stretch;justify-content:stretch;
  background:#111820;overscroll-behavior:none;touch-action:none
}
.edit-modal.show{display:block}
.edit-sheet{
  width:100%;height:100dvh;max-width:none!important;border-radius:0!important;
  padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
  background:#111820;color:#fff;display:flex;flex-direction:column;
  overflow:hidden;overscroll-behavior:none;touch-action:none
}
.edit-grab{display:none}
.edit-title{font-size:18px;color:#fff}
.edit-note{color:#b8c3cc;margin-bottom:8px}
.gesture-status{
  width:100%;margin:0 0 8px;background:#1f2c36;color:#d8e8f4
}
.edit-stage{
  flex:1;width:100%;min-height:0;margin:0;
  border-radius:14px;background:#0a0f13;border:1px solid #344551;
  touch-action:none!important;overscroll-behavior:none!important;
  overflow:hidden;position:relative
}
.edit-stage img{
  position:absolute;left:50%;top:50%;max-width:none;max-height:none;
  transform-origin:center center;will-change:transform;
  user-select:none;-webkit-user-select:none;-webkit-user-drag:none;pointer-events:none
}
.edit-actions,.zoom-buttons{width:100%;max-width:none}
.zoom-buttons button,.edit-actions .soft{background:#263743;color:#fff}
.edit-actions .primary{background:#3b82f6;color:#fff}
body.editor-locked{
  position:fixed!important;
  width:100%!important;
  overflow:hidden!important;
  touch-action:none!important;
}
@media(min-width:700px){
  .edit-modal{padding:0}
  .edit-sheet{max-width:none}
}


.add-photo-btn{
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;text-align:center;user-select:none;-webkit-user-select:none
}


.edit-stage.loading:after{
  content:"載入照片中…";position:absolute;inset:0;display:grid;place-items:center;
  color:#dbe7ef;background:#0a0f13;font-weight:800;z-index:3
}

</style>
</head>
<body>
<header>
  <div class="header-row">
    <div>
      <h1>🖼️ 手機圖片拼接</h1>
      <div class="subtitle">v5.3・修正單格編輯無法開啟</div>
    </div>
    <button class="reset-top" onclick="resetAll()">清空</button>
  </div>
</header>


<input id="fileInput" type="file" accept="image/*" multiple hidden>
<main>
<section class="card">
    <div class="card-title">照片 <span id="photoCount" style="color:var(--muted);font-size:12px"></span></div>
    <div class="compact-note">左右滑動查看；旋轉後縮圖會立刻更新。</div>
    <div id="photoStrip" class="photo-strip"></div><div id="emptyPhotoHint" class="card-note">請使用下方「＋ 加照片」開始。</div>
  </section>

  <section class="card">
    <div class="card-title">版型</div>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="join" onclick="setMode('join',this)">拼接</button>
      <button class="mode-tab" data-mode="grid" onclick="setMode('grid',this)">格子</button>
    </div>

    <div id="joinLayouts" class="layout-panel active">
      <div class="layout-scroll">
        <button class="layout active" data-layout="vertical" onclick="setLayout('vertical',this)">
          <div class="layout-icon icon-v"><span></span><span></span></div><div class="layout-label">上下</div>
        </button>
        <button class="layout" data-layout="horizontal" onclick="setLayout('horizontal',this)">
          <div class="layout-icon icon-h"><span></span><span></span></div><div class="layout-label">左右</div>
        </button>
        <button class="layout" data-layout="vertical3" onclick="setLayout('vertical3',this)">
          <div class="layout-icon icon-v3"><span></span><span></span><span></span></div><div class="layout-label">3 直排</div>
        </button>
        <button class="layout" data-layout="horizontal3" onclick="setLayout('horizontal3',this)">
          <div class="layout-icon icon-h3"><span></span><span></span><span></span></div><div class="layout-label">3 橫排</div>
        </button>
        <button class="layout" data-layout="vertical4" onclick="setLayout('vertical4',this)">
          <div class="layout-icon icon-v4"><span></span><span></span><span></span><span></span></div><div class="layout-label">4 直排</div>
        </button>
        <button class="layout" data-layout="horizontal4" onclick="setLayout('horizontal4',this)">
          <div class="layout-icon icon-h4"><span></span><span></span><span></span><span></span></div><div class="layout-label">4 橫排</div>
        </button>
      </div>
    </div>

    <div id="gridLayouts" class="layout-panel">
      <div class="layout-scroll">
        <button class="layout" data-layout="grid2h" onclick="setLayout('grid2h',this)">
          <div class="layout-icon icon-h"><span></span><span></span></div><div class="layout-label">2 左右</div>
        </button>
        <button class="layout" data-layout="grid2v" onclick="setLayout('grid2v',this)">
          <div class="layout-icon icon-v"><span></span><span></span></div><div class="layout-label">2 上下</div>
        </button>
        <button class="layout" data-layout="grid3top" onclick="setLayout('grid3top',this)">
          <div class="layout-icon custom-grid"><span class="big-top"></span><span></span><span></span></div><div class="layout-label">上1下2</div>
        </button>
        <button class="layout" data-layout="grid3left" onclick="setLayout('grid3left',this)">
          <div class="layout-icon custom-grid left-big"><span class="big-left"></span><span></span><span></span></div><div class="layout-label">左1右2</div>
        </button>
        <button class="layout" data-layout="grid3bottom" onclick="setLayout('grid3bottom',this)">
          <div class="layout-icon custom-grid"><span></span><span></span><span class="big-bottom"></span></div><div class="layout-label">上2下1</div>
        </button>
        <button class="layout" data-layout="grid3right" onclick="setLayout('grid3right',this)">
          <div class="layout-icon custom-grid right-big"><span></span><span></span><span class="big-right"></span></div><div class="layout-label">左2右1</div>
        </button>
        <button class="layout" data-layout="grid4" onclick="setLayout('grid4',this)">
          <div class="layout-icon icon-4"><span></span><span></span><span></span><span></span></div><div class="layout-label">4 格</div>
        </button>
        <button class="layout" data-layout="grid6v" onclick="setLayout('grid6v',this)">
          <div class="layout-icon icon-6"><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="layout-label">6 格</div>
        </button>
        <button class="layout" data-layout="grid9" onclick="setLayout('grid9',this)">
          <div class="layout-icon icon-9"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="layout-label">9 格</div>
        </button>
      </div>
    </div>
<div id="capacityNote" class="capacity"></div>
  </section>

  <section class="card">
    <div class="card-title">預覽</div>
    <div class="preview-wrap">
      <div class="canvas-shell">
        <div id="emptyPreview" class="empty-preview">選擇照片後會在這裡預覽</div>
        <div id="canvasStage" class="canvas-stage hidden">
          <canvas id="previewCanvas"></canvas>
          <div id="gridOverlay" class="grid-overlay"></div>
        </div>
      </div>
      <div id="previewHint" class="preview-hint hidden">
        <strong>格子模式：</strong>點格子編號後，可單獨拖曳與雙指縮放
      </div>
    </div>
  </section>

    <details class="settings-details">
      <summary>間距、圓角與比例</summary>
      <div class="controls">
        <div class="control">
          <div class="control-head"><label for="gapRange">照片間距</label><span class="control-value"><span id="gapValue">6</span> px</span></div>
          <input id="gapRange" type="range" min="0" max="24" value="6">
        </div>
        <div class="control">
          <div class="control-head"><label for="roundRange">照片圓角</label><span class="control-value"><span id="roundValue">0</span> px</span></div>
          <input id="roundRange" type="range" min="0" max="30" value="0">
        </div>
        <div class="control">
          <div class="control-head"><label>格子內照片</label></div>
          <div class="segment">
            <button id="fitCover" class="active" onclick="setFit('cover')">填滿裁切</button>
            <button id="fitContain" onclick="setFit('contain')">完整顯示</button>
          </div>
        </div>
        <div class="control ratio-wrap" id="ratioWrap">
          <div class="control-head"><label>輸出比例</label></div>
          <div class="segment" style="grid-template-columns:repeat(3,1fr)">
            <button class="ratio-btn active" data-ratio="1:1" onclick="setRatio('1:1',this)">1:1</button>
            <button class="ratio-btn" data-ratio="4:5" onclick="setRatio('4:5',this)">4:5</button>
            <button class="ratio-btn" data-ratio="9:16" onclick="setRatio('9:16',this)">9:16</button>
          </div>
        </div>
      </div>
    </details>
    <div id="capacityNote" class="capacity"></div>
</main>


<div class="bottom">
  <div class="bottom-inner">
    <label class="btn add-photo-btn" for="fileInput">＋ 加照片</label>
    <button id="exportBtn" class="btn primary" onclick="exportJpg()" disabled>輸出／分享 JPG</button>
  </div>
</div>

<div id="editModal" class="edit-modal" onclick="closeEditorByBackdrop(event)">
  <div class="edit-sheet">
    <div class="edit-grab"></div>
    <div class="edit-title">調整格子畫面</div>
    <div class="edit-note">你現在只會調整這一格。直接拖動照片；雙指可縮放。</div>
    <div id="gestureStatus" class="gesture-status">載入編輯畫面中…</div>
    <div id="editStage" class="edit-stage">
      <img id="editImage" alt="">
      <div class="edit-cross"></div>
    </div>
    <div class="zoom-buttons">
      <button type="button" onclick="editorZoomBy(-0.15)">－ 縮小</button>
      <button type="button" onclick="editorZoomBy(0.15)">＋ 放大</button>
    </div>
    <div class="edit-actions">
      <button class="soft" onclick="resetEditor()">重設</button>
      <button class="soft" onclick="closeEditor()">取消</button>
      <button class="primary" onclick="saveEditor()">完成</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const state = {
  mode: localStorage.getItem("collage_mode") || "join",
  layout: localStorage.getItem("collage_layout") || "vertical",
  gap: Number(localStorage.getItem("collage_gap") || 6),
  radius: Number(localStorage.getItem("collage_radius") || 0),
  fit: localStorage.getItem("collage_fit") || "cover",
  ratio: localStorage.getItem("collage_ratio") || "1:1",
  photos: []
};
const capacities = {grid2h:2,grid2v:2,grid3top:3,grid3left:3,grid3bottom:3,grid3right:3,grid4:4,grid6v:6,grid9:9};
const joinCaps = {vertical3:3,horizontal3:3,vertical4:4,horizontal4:4};

const fileInput = document.getElementById("fileInput");
const previewCanvas = document.getElementById("previewCanvas");
const canvasStage = document.getElementById("canvasStage");
const gridOverlay = document.getElementById("gridOverlay");
let previewTimer = null;
let previewHitboxes = [];

let editorPhotoIndex = -1;
let editorDraft = {x:0.5,y:0.5,zoom:1,panX:0,panY:0};
let editorAspect = 1;
let editorBase = null;
let editorTempUrl = "";

fileInput.addEventListener("change", async (event)=>{
  const files = Array.from(event.target.files || []);
  if(!files.length) return;
  const remaining = Math.max(0, 20 - state.photos.length);
  const selected = files.slice(0, remaining);
  if(files.length > remaining) showToast("最多保留 20 張照片");

  for(const file of selected){
    try{
      const imgData = await loadImage(file);
      state.photos.push({
        id:"p_" + Date.now() + "_" + Math.random().toString(36).slice(2),
        file,
        url: imgData.url,
        img: imgData.image,
        name: file.name,
        width: imgData.image.naturalWidth,
        height: imgData.image.naturalHeight,
        rotation: 0,
        focusX: 0.5,
        focusY: 0.5,
        zoom: 1
      });
    }catch(e){
      showToast("有照片無法讀取");
    }
  }
  fileInput.value = "";
  renderPhotos();
  if(state.mode==="grid" && !state.layout.startsWith("grid")){
    const firstGrid = document.querySelector("#gridLayouts .layout");
    setLayout(firstGrid.dataset.layout, firstGrid);
  }
  await renderPreview();
});

function loadImage(file){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.onload = ()=>resolve({image,url});
    image.onerror = ()=>{URL.revokeObjectURL(url);reject(new Error("load failed"))};
    image.src = url;
  });
}



function setMode(mode, button){
  state.mode = mode;
  localStorage.setItem("collage_mode", mode);
  document.querySelectorAll(".mode-tab").forEach(b=>b.classList.remove("active"));
  if(button) button.classList.add("active");
  document.getElementById("joinLayouts").classList.toggle("active", mode==="join");
  document.getElementById("gridLayouts").classList.toggle("active", mode==="grid");
  if(mode==="grid" && state.fit!=="cover") setFit("cover");
  const activePanel = mode==="join" ? document.getElementById("joinLayouts") : document.getElementById("gridLayouts");
  let candidate = activePanel.querySelector(`.layout[data-layout="${state.layout}"]`);
  if(!candidate) candidate = activePanel.querySelector(".layout");
  state.layout = candidate.dataset.layout;
  localStorage.setItem("collage_layout", state.layout);
  document.querySelectorAll(".layout").forEach(b=>b.classList.remove("active"));
  candidate.classList.add("active");
  document.getElementById("ratioWrap").classList.toggle("show", !!capacities[state.layout]);
  updateCapacityNote();
  if(state.photos.length) renderPreview();
}

function setLayout(layout, button){
  state.layout = layout;
  localStorage.setItem("collage_layout", layout);
  document.querySelectorAll(".layout").forEach(b=>b.classList.remove("active"));
  if(button) button.classList.add("active");
  document.getElementById("ratioWrap").classList.toggle("show", !!capacities[layout]);
  updateCapacityNote();
  if(state.photos.length) renderPreview();
  else schedulePreview();
}

function setFit(fit){
  state.fit = fit;
  localStorage.setItem("collage_fit", fit);
  document.getElementById("fitCover").classList.toggle("active", fit==="cover");
  document.getElementById("fitContain").classList.toggle("active", fit==="contain");
  schedulePreview();
}

function setRatio(ratio, button){
  state.ratio = ratio;
  localStorage.setItem("collage_ratio", ratio);
  document.querySelectorAll(".ratio-btn").forEach(b=>b.classList.remove("active"));
  if(button) button.classList.add("active");
  schedulePreview();
}

document.getElementById("gapRange").addEventListener("input", e=>{
  state.gap = Number(e.target.value);
  document.getElementById("gapValue").textContent = state.gap;
  localStorage.setItem("collage_gap", state.gap);
  schedulePreview();
});
document.getElementById("roundRange").addEventListener("input", e=>{
  state.radius = Number(e.target.value);
  document.getElementById("roundValue").textContent = state.radius;
  localStorage.setItem("collage_radius", state.radius);
  schedulePreview();
});

function renderPhotos(){
  const root = document.getElementById("photoStrip");
  root.innerHTML = "";
  document.getElementById("photoCount").textContent = state.photos.length ? `共 ${state.photos.length} 張` : "";
  state.photos.forEach((photo,index)=>{
    const chip = document.createElement("div");
    chip.className = "photo-chip";
    const thumbSrc = getOrientedCanvas(photo).toDataURL("image/jpeg",0.84);
    chip.innerHTML = `
      <div class="thumb-wrap">
        <img src="${thumbSrc}" alt="">
        <span class="rotation-badge">${photo.rotation || 0}°</span>
      </div>
      <div class="photo-chip-index">第 ${index+1} 張</div>
      <div class="photo-chip-actions">
        <button onclick="rotatePhoto(${index},-90)">↶</button>
        <button onclick="rotatePhoto(${index},90)">↷</button>
        <button onclick="movePhoto(${index},-1)" ${index===0?"disabled":""}>←</button>
        <button onclick="movePhoto(${index},1)" ${index===state.photos.length-1?"disabled":""}>→</button>
        <button class="danger" onclick="removePhoto(${index})">刪除</button>
      </div>`;
    root.appendChild(chip);
  });
  document.getElementById("exportBtn").disabled = state.photos.length===0;
  document.getElementById("emptyPhotoHint").classList.toggle("hidden", state.photos.length>0);
  updateCapacityNote();
}

function movePhoto(index, direction){
  const target = index + direction;
  if(target < 0 || target >= state.photos.length) return;
  [state.photos[index],state.photos[target]] = [state.photos[target],state.photos[index]];
  renderPhotos();
  schedulePreview();
}

function removePhoto(index){
  const removed = state.photos.splice(index,1)[0];
  if(removed) URL.revokeObjectURL(removed.url);
  renderPhotos();
  schedulePreview();
}

function rotatePhoto(index, delta){
  const photo = state.photos[index];
  if(!photo) return;
  photo.rotation = ((photo.rotation || 0) + delta + 360) % 360;
  const tmp = photo.width;
  if(Math.abs(delta) % 180 === 90){
    photo.width = photo.height;
    photo.height = tmp;
  }
  renderPhotos();
  schedulePreview();
  showToast(delta < 0 ? "已向左旋轉 90°" : "已向右旋轉 90°");
}

function resetAll(){
  if(state.photos.length && !confirm("確定清空全部照片嗎？")) return;
  state.photos.forEach(p=>URL.revokeObjectURL(p.url));
  state.photos = [];
  renderPhotos();
  schedulePreview();
}

function updateCapacityNote(){
  const cap = capacities[state.layout] || joinCaps[state.layout];
  const note = document.getElementById("capacityNote");
  if(cap && state.photos.length > cap){
    note.textContent = `此版型最多使用 ${cap} 張，目前有 ${state.photos.length} 張；輸出時只會使用前 ${cap} 張。`;
    note.classList.add("show");
  }else{
    note.classList.remove("show");
  }
}

function schedulePreview(){
  clearTimeout(previewTimer);
  previewTimer = setTimeout(()=>renderPreview(),100);
}

async function renderPreview(){
  if(!state.photos.length){
    canvasStage.classList.add("hidden");
    gridOverlay.innerHTML = "";
    gridOverlay.classList.remove("active");
    document.getElementById("emptyPreview").classList.remove("hidden");
    document.getElementById("previewHint").classList.add("hidden");
    return;
  }
  document.getElementById("emptyPreview").classList.add("hidden");
  canvasStage.classList.remove("hidden");
  try{
    await drawCollage(previewCanvas, true);
    buildGridOverlay();
    document.getElementById("previewHint").classList.toggle("hidden", !state.layout.startsWith("grid"));
  }catch(e){
    console.error(e);
    showToast("預覽建立失敗");
  }
}

function getGridConfig(layout){
  if(layout==="grid2h") return {cols:2,rows:1,cap:2};
  if(layout==="grid2v") return {cols:1,rows:2,cap:2};
  if(layout==="grid4") return {cols:2,rows:2,cap:4};
  if(layout==="grid6v") return {cols:2,rows:3,cap:6};
  if(layout==="grid9") return {cols:3,rows:3,cap:9};
  return null;
}

function ratioDimensions(ratio, longSide){
  if(ratio==="4:5") return {w:longSide, h:Math.round(longSide*1.25)};
  if(ratio==="9:16") return {w:Math.round(longSide*0.5625), h:longSide};
  return {w:longSide, h:longSide};
}

async function drawCollage(canvas, preview){
  const photos = state.photos.slice();
  if(preview) previewHitboxes = [];
  if(!photos.length) return;

  let width, height, placements = [];
  const gapBase = state.gap;
  const radiusBase = state.radius;

  if(state.layout==="vertical"){
    width = preview ? 720 : 1800;
    const gap = preview ? gapBase*1.5 : gapBase*4;
    let y = 0;
    photos.forEach((p,i)=>{
      const h = Math.max(1, Math.round(width * p.height / p.width));
      placements.push({photo:p,x:0,y,w:width,h,mode:"contain"});
      y += h + (i < photos.length-1 ? gap : 0);
    });
    height = Math.round(y);
  }else if(state.layout==="horizontal"){
    height = preview ? 620 : 1500;
    const gap = preview ? gapBase*1.5 : gapBase*4;
    let x = 0;
    photos.forEach((p,i)=>{
      const w = Math.max(1, Math.round(height * p.width / p.height));
      placements.push({photo:p,x,y:0,w,h:height,mode:"contain"});
      x += w + (i < photos.length-1 ? gap : 0);
    });
    width = Math.round(x);
  }else if(["vertical3","vertical4"].includes(state.layout)){
    const limit = state.layout==="vertical3" ? 3 : 4;
    const used = photos.slice(0,limit);
    width = preview ? 720 : 1800;
    const gap = preview ? gapBase*1.5 : gapBase*4;
    let y = 0;
    used.forEach((p,i)=>{
      const h = Math.max(1, Math.round(width * p.height / p.width));
      placements.push({photo:p,x:0,y,w:width,h,mode:"contain"});
      y += h + (i < used.length-1 ? gap : 0);
    });
    height = Math.round(y);
  }else if(["horizontal3","horizontal4"].includes(state.layout)){
    const limit = state.layout==="horizontal3" ? 3 : 4;
    const used = photos.slice(0,limit);
    height = preview ? 620 : 1500;
    const gap = preview ? gapBase*1.5 : gapBase*4;
    let x = 0;
    used.forEach((p,i)=>{
      const w = Math.max(1, Math.round(height * p.width / p.height));
      placements.push({photo:p,x,y:0,w,h:height,mode:"contain"});
      x += w + (i < used.length-1 ? gap : 0);
    });
    width = Math.round(x);
  }else if(state.layout.startsWith("grid")){
    const dims = ratioDimensions(state.ratio, preview ? 760 : (state.ratio==="9:16" ? 3200 : 2400));
    width = dims.w;
    height = dims.h;
    const gap = preview ? gapBase*1.5 : gapBase*4;

    if(["grid3top","grid3left","grid3bottom","grid3right"].includes(state.layout)){
      const used = photos.slice(0,3);
      const halfW = (width-gap)/2;
      const halfH = (height-gap)/2;
      const maps = {
        grid3top:[
          {x:0,y:0,w:width,h:halfH},
          {x:0,y:halfH+gap,w:halfW,h:halfH},
          {x:halfW+gap,y:halfH+gap,w:halfW,h:halfH}
        ],
        grid3bottom:[
          {x:0,y:0,w:halfW,h:halfH},
          {x:halfW+gap,y:0,w:halfW,h:halfH},
          {x:0,y:halfH+gap,w:width,h:halfH}
        ],
        grid3left:[
          {x:0,y:0,w:halfW,h:height},
          {x:halfW+gap,y:0,w:halfW,h:halfH},
          {x:halfW+gap,y:halfH+gap,w:halfW,h:halfH}
        ],
        grid3right:[
          {x:0,y:0,w:halfW,h:halfH},
          {x:0,y:halfH+gap,w:halfW,h:halfH},
          {x:halfW+gap,y:0,w:halfW,h:height}
        ]
      };
      used.forEach((p,i)=>placements.push({photo:p,...maps[state.layout][i],mode:state.fit}));
    }else{
      const cfg = getGridConfig(state.layout);
      const used = photos.slice(0,cfg.cap);
      const cellW = (width - gap*(cfg.cols-1)) / cfg.cols;
      const cellH = (height - gap*(cfg.rows-1)) / cfg.rows;
      used.forEach((p,i)=>{
        const col = i % cfg.cols;
        const row = Math.floor(i / cfg.cols);
        placements.push({
          photo:p,
          x:col*(cellW+gap),
          y:row*(cellH+gap),
          w:cellW,
          h:cellH,
          mode:state.fit
        });
      });
    }
  }

  const maxCanvasSide = preview ? 1800 : 8192;
  const scaleDown = Math.min(1, maxCanvasSide/Math.max(width,height));
  if(scaleDown < 1){
    width = Math.round(width*scaleDown);
    height = Math.round(height*scaleDown);
    placements = placements.map(p=>({...p,x:p.x*scaleDown,y:p.y*scaleDown,w:p.w*scaleDown,h:p.h*scaleDown}));
  }

  canvas.width = Math.max(1,Math.round(width));
  canvas.height = Math.max(1,Math.round(height));
  const ctx = canvas.getContext("2d",{alpha:false});
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  const radius = (preview ? radiusBase*1.5 : radiusBase*4) * scaleDown;
  placements.forEach(p=>{
    drawImageInBox(ctx,p.photo,p.x,p.y,p.w,p.h,p.mode,radius);
    if(preview){
      previewHitboxes.push({index:state.photos.indexOf(p.photo),x:p.x,y:p.y,w:p.w,h:p.h});
    }
  });
}

function getOrientedCanvas(photo){
  const rotation = ((photo.rotation || 0) + 360) % 360;
  if(!rotation) return photo.img;
  const src = photo.img;
  const canvas = document.createElement("canvas");
  const swap = rotation === 90 || rotation === 270;
  canvas.width = swap ? src.naturalHeight : src.naturalWidth;
  canvas.height = swap ? src.naturalWidth : src.naturalHeight;
  const ctx = canvas.getContext("2d");
  ctx.translate(canvas.width/2,canvas.height/2);
  ctx.rotate(rotation*Math.PI/180);
  ctx.drawImage(src,-src.naturalWidth/2,-src.naturalHeight/2);
  return canvas;
}

function roundedRectPath(ctx,x,y,w,h,r){
  const radius = Math.max(0,Math.min(r,Math.min(w,h)/2));
  ctx.beginPath();
  ctx.moveTo(x+radius,y);
  ctx.arcTo(x+w,y,x+w,y+h,radius);
  ctx.arcTo(x+w,y+h,x,y+h,radius);
  ctx.arcTo(x,y+h,x,y,radius);
  ctx.arcTo(x,y,x+w,y,radius);
  ctx.closePath();
}

function drawImageInBox(ctx,photo,x,y,w,h,mode,radius){
  const img = getOrientedCanvas(photo);
  const iw = img.naturalWidth || img.width;
  const ih = img.naturalHeight || img.height;
  ctx.save();
  roundedRectPath(ctx,x,y,w,h,radius);
  ctx.clip();

  if(mode==="contain"){
    ctx.fillStyle="#fff";
    ctx.fillRect(x,y,w,h);
    const scale = Math.min(w/iw,h/ih);
    const dw = iw*scale;
    const dh = ih*scale;
    ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
  }else{
    const scale = Math.max(w/iw,h/ih);
    const zoom = Number.isFinite(photo.zoom) ? Math.max(1, photo.zoom) : 1;
    const sw = (w/scale)/zoom;
    const sh = (h/scale)/zoom;
    const fx = Number.isFinite(photo.focusX) ? photo.focusX : 0.5;
    const fy = Number.isFinite(photo.focusY) ? photo.focusY : 0.5;
    const sx = Math.max(0,Math.min(iw-sw,fx*iw-sw/2));
    const sy = Math.max(0,Math.min(ih-sh,fy*ih-sh/2));
    ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
  }
  ctx.restore();
}



function buildGridOverlay(){
  gridOverlay.innerHTML = "";
  const isGrid = state.layout.startsWith("grid");
  gridOverlay.classList.toggle("active", isGrid);
  if(!isGrid) return;

  previewHitboxes.forEach((box, order)=>{
    if(box.index < 0) return;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "grid-hit";
    btn.setAttribute("aria-label", `調整第 ${order+1} 格照片`);
    btn.style.left = `${(box.x/previewCanvas.width)*100}%`;
    btn.style.top = `${(box.y/previewCanvas.height)*100}%`;
    btn.style.width = `${(box.w/previewCanvas.width)*100}%`;
    btn.style.height = `${(box.h/previewCanvas.height)*100}%`;
    btn.innerHTML = `<span class="grid-badge">${order+1}</span>`;
    btn.addEventListener("click", async e=>{
      e.preventDefault();
      e.stopPropagation();
      if(editorIsOpen) return;
      document.querySelectorAll(".grid-hit").forEach(el=>el.classList.remove("selected"));
      btn.classList.add("selected");
      await openEditor(box.index, box);
    });
    gridOverlay.appendChild(btn);
  });
}



let lockedScrollY = 0;
let editorIsOpen = false;

function lockPageForEditor(){
  lockedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  editorIsOpen = true;
  document.body.classList.add("editor-locked");
  document.body.style.top = `-${lockedScrollY}px`;
}

function unlockPageFromEditor(){
  editorIsOpen = false;
  document.body.classList.remove("editor-locked");
  document.body.style.top = "";
  window.scrollTo(0, lockedScrollY);
}

document.addEventListener("touchmove", e=>{
  if(editorIsOpen) e.preventDefault();
},{passive:false,capture:true});

document.addEventListener("wheel", e=>{
  if(editorIsOpen && !e.target.closest("#editStage")) e.preventDefault();
},{passive:false,capture:true});


async function createEditorPreviewUrl(photo){
  const oriented = getOrientedCanvas(photo);
  const maxSide = 1600;
  const scale = Math.min(1, maxSide / Math.max(oriented.width, oriented.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(oriented.width * scale));
  canvas.height = Math.max(1, Math.round(oriented.height * scale));
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(oriented, 0, 0, canvas.width, canvas.height);
  const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.9));
  if(!blob) throw new Error("editor preview failed");
  return URL.createObjectURL(blob);
}

async function openEditor(index, hitbox){
  const photo = state.photos[index];
  if(!photo) return;

  editorPhotoIndex = index;
  editorDraft = {
    x: Number.isFinite(photo.focusX) ? photo.focusX : 0.5,
    y: Number.isFinite(photo.focusY) ? photo.focusY : 0.5,
    zoom: Number.isFinite(photo.zoom) ? Math.max(1.12, photo.zoom) : 1.12,
    panX: 0,
    panY: 0
  };
  editorAspect = hitbox && hitbox.w > 0 && hitbox.h > 0 ? hitbox.w / hitbox.h : 1;

  const stage = document.getElementById("editStage");
  const img = document.getElementById("editImage");
  stage.style.aspectRatio = `${editorAspect}`;
  stage.classList.add("loading");
  img.removeAttribute("src");

  lockPageForEditor();
  document.getElementById("editModal").classList.add("show");
  document.getElementById("gestureStatus").textContent = "載入編輯畫面中…";

  try{
    if(editorTempUrl) URL.revokeObjectURL(editorTempUrl);
    editorTempUrl = await createEditorPreviewUrl(photo);
    if(editorPhotoIndex !== index) return;

    await new Promise((resolve,reject)=>{
      img.onload = resolve;
      img.onerror = reject;
      img.src = editorTempUrl;
    });

    editorBase = null;
    initializeEditorPosition();
    updateEditorStage();
    stage.classList.remove("loading");
    document.getElementById("gestureStatus").textContent = "請在照片上拖動";
  }catch(error){
    console.error(error);
    stage.classList.remove("loading");
    document.getElementById("gestureStatus").textContent = "照片載入失敗，請取消後重試";
  }
}

function initializeEditorPosition(){
  if(editorPhotoIndex < 0) return;
  const photo = state.photos[editorPhotoIndex];
  const oriented = getOrientedCanvas(photo);
  const stage = document.getElementById("editStage");
  const sw = stage.clientWidth;
  const sh = stage.clientHeight;
  const baseScale = Math.max(sw/oriented.width, sh/oriented.height);
  editorBase = {sw,sh,ow:oriented.width,oh:oriented.height,baseScale};
  const iw = oriented.width * baseScale * editorDraft.zoom;
  const ih = oriented.height * baseScale * editorDraft.zoom;
  const rangeX = Math.max(0,(iw-sw)/2);
  const rangeY = Math.max(0,(ih-sh)/2);
  editorDraft.panX = (0.5-editorDraft.x) * rangeX * 2;
  editorDraft.panY = (0.5-editorDraft.y) * rangeY * 2;
  clampEditorPan();
}

function currentEditorMetrics(){
  if(!editorBase) initializeEditorPosition();
  if(!editorBase) return null;
  const iw = editorBase.ow * editorBase.baseScale * editorDraft.zoom;
  const ih = editorBase.oh * editorBase.baseScale * editorDraft.zoom;
  return {
    sw:editorBase.sw, sh:editorBase.sh, iw, ih,
    maxX:Math.max(0,(iw-editorBase.sw)/2),
    maxY:Math.max(0,(ih-editorBase.sh)/2)
  };
}

function clampEditorPan(){
  const m = currentEditorMetrics();
  if(!m) return;
  editorDraft.zoom = Math.min(3.5,Math.max(1,editorDraft.zoom));
  editorDraft.panX = Math.min(m.maxX,Math.max(-m.maxX,editorDraft.panX));
  editorDraft.panY = Math.min(m.maxY,Math.max(-m.maxY,editorDraft.panY));
}

function updateEditorStage(){
  if(editorPhotoIndex < 0) return;
  const img = document.getElementById("editImage");
  const m = currentEditorMetrics();
  if(!m) return;
  clampEditorPan();
  img.style.width = (editorBase.ow * editorBase.baseScale) + "px";
  img.style.height = (editorBase.oh * editorBase.baseScale) + "px";
  img.style.transform = `translate3d(calc(-50% + ${editorDraft.panX}px), calc(-50% + ${editorDraft.panY}px), 0) scale(${editorDraft.zoom})`;
}

function editorZoomBy(delta){
  const oldZoom = editorDraft.zoom;
  editorDraft.zoom = Math.min(3.5,Math.max(1,editorDraft.zoom+delta));
  const ratio = editorDraft.zoom / oldZoom;
  editorDraft.panX *= ratio;
  editorDraft.panY *= ratio;
  clampEditorPan();
  updateEditorStage();
  document.getElementById("gestureStatus").textContent = `縮放 ${Math.round(editorDraft.zoom*100)}%`;
}

function resetEditor(){
  editorDraft.zoom = 1.12;
  editorDraft.panX = 0;
  editorDraft.panY = 0;
  updateEditorStage();
  document.getElementById("gestureStatus").textContent = "已恢復置中";
}

function saveEditor(){
  const photo = state.photos[editorPhotoIndex];
  const m = currentEditorMetrics();
  if(photo && m){
    photo.zoom = editorDraft.zoom;
    photo.focusX = m.maxX > 0 ? Math.min(1,Math.max(0,0.5-editorDraft.panX/(m.maxX*2))) : 0.5;
    photo.focusY = m.maxY > 0 ? Math.min(1,Math.max(0,0.5-editorDraft.panY/(m.maxY*2))) : 0.5;
  }
  closeEditor();
  renderPreview();
}

function closeEditor(){
  document.getElementById("editModal").classList.remove("show");
  unlockPageFromEditor();
  editorPhotoIndex = -1;
  editorBase = null;
  if(editorTempUrl){
    URL.revokeObjectURL(editorTempUrl);
    editorTempUrl = "";
  }
  touchGesture = null;
  editStage.classList.remove("drag-active","pinch-active");
  document.querySelectorAll(".grid-hit").forEach(el=>el.classList.remove("selected"));
}
function closeEditorByBackdrop(event){
  if(event.target.id==="editModal") closeEditor();
}

const editStage = document.getElementById("editStage");
let touchGesture = null;
let mouseGesture = null;

editStage.addEventListener("touchstart", e=>{
  if(editorPhotoIndex<0) return;
  e.preventDefault();
  if(e.touches.length===1){
    const t=e.touches[0];
    touchGesture={
      type:"drag",x:t.clientX,y:t.clientY,
      panX:editorDraft.panX,panY:editorDraft.panY
    };
    editStage.classList.add("drag-active");
    editStage.classList.remove("pinch-active");
    document.getElementById("gestureStatus").textContent="拖曳中";
  }else if(e.touches.length>=2){
    const a=e.touches[0],b=e.touches[1];
    touchGesture={
      type:"pinch",
      distance:Math.max(1,Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)),
      zoom:editorDraft.zoom,
      panX:editorDraft.panX,panY:editorDraft.panY
    };
    editStage.classList.add("pinch-active");
    editStage.classList.remove("drag-active");
    document.getElementById("gestureStatus").textContent="縮放中";
  }
},{passive:false});

editStage.addEventListener("touchmove", e=>{
  if(editorPhotoIndex<0 || !touchGesture) return;
  e.preventDefault();
  if(touchGesture.type==="drag" && e.touches.length===1){
    const t=e.touches[0];
    editorDraft.panX=touchGesture.panX+(t.clientX-touchGesture.x);
    editorDraft.panY=touchGesture.panY+(t.clientY-touchGesture.y);
    clampEditorPan();
    updateEditorStage();
  }else if(e.touches.length>=2){
    if(touchGesture.type!=="pinch"){
      const a=e.touches[0],b=e.touches[1];
      touchGesture={
        type:"pinch",
        distance:Math.max(1,Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)),
        zoom:editorDraft.zoom,
        panX:editorDraft.panX,panY:editorDraft.panY
      };
    }
    const a=e.touches[0],b=e.touches[1];
    const distance=Math.max(1,Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY));
    const oldZoom=editorDraft.zoom;
    editorDraft.zoom=Math.min(3.5,Math.max(1,touchGesture.zoom*(distance/touchGesture.distance)));
    const ratio=editorDraft.zoom/Math.max(.01,oldZoom);
    editorDraft.panX*=ratio;
    editorDraft.panY*=ratio;
    clampEditorPan();
    updateEditorStage();
    document.getElementById("gestureStatus").textContent=`縮放 ${Math.round(editorDraft.zoom*100)}%`;
  }
},{passive:false});

editStage.addEventListener("touchend",e=>{
  e.preventDefault();
  editStage.classList.remove("drag-active","pinch-active");
  if(e.touches.length===1){
    const t=e.touches[0];
    touchGesture={type:"drag",x:t.clientX,y:t.clientY,panX:editorDraft.panX,panY:editorDraft.panY};
  }else{
    touchGesture=null;
    document.getElementById("gestureStatus").textContent="可繼續拖動或雙指縮放";
  }
},{passive:false});
editStage.addEventListener("touchcancel",()=>{
  touchGesture=null;
  editStage.classList.remove("drag-active","pinch-active");
},{passive:false});

editStage.addEventListener("mousedown",e=>{
  if(editorPhotoIndex<0) return;
  e.preventDefault();
  mouseGesture={x:e.clientX,y:e.clientY,panX:editorDraft.panX,panY:editorDraft.panY};
  editStage.classList.add("drag-active");
});
window.addEventListener("mousemove",e=>{
  if(!mouseGesture || editorPhotoIndex<0) return;
  editorDraft.panX=mouseGesture.panX+(e.clientX-mouseGesture.x);
  editorDraft.panY=mouseGesture.panY+(e.clientY-mouseGesture.y);
  clampEditorPan();
  updateEditorStage();
});
window.addEventListener("mouseup",()=>{
  mouseGesture=null;
  editStage.classList.remove("drag-active");
});
editStage.addEventListener("wheel",e=>{
  if(editorPhotoIndex<0) return;
  e.preventDefault();
  editorZoomBy(e.deltaY<0 ? .08 : -.08);
},{passive:false});

async function exportJpg(){
  if(!state.photos.length) return;
  const btn = document.getElementById("exportBtn");
  btn.disabled = true;
  btn.textContent = "處理中…";
  try{
    const exportCanvas = document.createElement("canvas");
    await drawCollage(exportCanvas, false);
    const blob = await new Promise(resolve=>exportCanvas.toBlob(resolve,"image/jpeg",0.94));
    if(!blob) throw new Error("blob failed");
    const filename = "圖片拼接_" + new Date().toISOString().slice(0,10) + ".jpg";
    const file = new File([blob], filename, {type:"image/jpeg"});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"圖片拼接"});
    }else{
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1500);
      showToast("JPG 已輸出");
    }
  }catch(e){
    if(e && e.name !== "AbortError"){
      console.error(e);
      showToast("輸出失敗，請減少照片後再試");
    }
  }finally{
    btn.disabled = state.photos.length===0;
    btn.textContent = "輸出／分享 JPG";
  }
}

function showToast(text){
  const toast = document.getElementById("toast");
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(()=>toast.classList.remove("show"),1800);
}

document.addEventListener("DOMContentLoaded", ()=>{
  document.getElementById("gapRange").value = state.gap;
  document.getElementById("gapValue").textContent = state.gap;
  document.getElementById("roundRange").value = state.radius;
  document.getElementById("roundValue").textContent = state.radius;
  setFit(state.fit);
  document.querySelectorAll(".ratio-btn").forEach(b=>b.classList.toggle("active", b.dataset.ratio===state.ratio));
  const modeButton = document.querySelector(`.mode-tab[data-mode="${state.mode}"]`) || document.querySelector('.mode-tab[data-mode="join"]');
  setMode(modeButton.dataset.mode, modeButton);
  renderPhotos();
  if(state.photos.length) renderPreview();
});

document.addEventListener("selectstart", e=>{
  if(e.target.closest && (e.target.closest("#canvasStage") || e.target.closest("#editStage"))) e.preventDefault();
});
document.addEventListener("contextmenu", e=>{
  if(e.target.closest && (e.target.closest("#canvasStage") || e.target.closest("#editStage"))) e.preventDefault();
});
window.addEventListener("resize", ()=>{ if(state.photos.length) buildGridOverlay(); });
</script>
